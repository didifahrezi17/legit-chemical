<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" fill="none">
    <defs>
        <linearGradient id="noProdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F1F5F9" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>
    </defs>
    <circle cx="150" cy="120" r="90" fill="url(#noProdGrad)"/>
    
    <g transform="translate(85, 50)">
        <!-- Search Magnifier with Box -->
        <rect x="25" y="45" width="80" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
        <line x1="25" y1="65" x2="105" y2="65" stroke="#E2E8F0" stroke-width="2"/>
        <line x1="65" y1="45" x2="65" y2="115" stroke="#E2E8F0" stroke-width="2"/>
        
        <!-- Big Magnifying Glass -->
        <circle cx="95" cy="45" r="30" fill="#FFFFFF" stroke="#0B3B82" stroke-width="6"/>
        <line x1="116" y1="66" x2="140" y2="90" stroke="#0B3B82" stroke-width="7" stroke-linecap="round"/>
        
        <!-- X mark inside glass -->
        <line x1="85" y1="35" x2="105" y2="55" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="105" y1="35" x2="85" y2="55" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round"/>
    </g>
</svg>

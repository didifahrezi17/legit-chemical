<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350" fill="none">
    <defs>
        <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B3B82" />
            <stop offset="100%" stop-color="#1565C0" />
        </linearGradient>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <filter id="aboutShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0B3B82" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- Background Base -->
    <rect width="500" height="350" rx="20" fill="url(#aboutGrad)"/>
    <circle cx="420" cy="60" r="120" fill="#FFFFFF" opacity="0.05"/>
    <circle cx="50" cy="300" r="90" fill="#FFFFFF" opacity="0.04"/>

    <!-- Central Laboratory & Warehouse Illustration -->
    <g transform="translate(60, 40)" filter="url(#aboutShadow)">
        <!-- Industrial Facility Card -->
        <rect width="380" height="270" rx="16" fill="#FFFFFF"/>
        
        <!-- Top Banner in Card -->
        <path d="M0 16 C0 7 7 0 16 0 L364 0 C373 0 380 7 380 16 L380 70 L0 70 Z" fill="#F8FAFC"/>
        <line x1="0" y1="70" x2="380" y2="70" stroke="#E2E8F0" stroke-width="1"/>
        
        <!-- Header Badge -->
        <rect x="25" y="20" width="130" height="30" rx="8" fill="#EBF3FC"/>
        <text x="90" y="39" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#0B3B82" text-anchor="middle">OFFICIAL PARTNER</text>
        
        <!-- Certified Badge -->
        <g transform="translate(300, 15)">
            <circle cx="20" cy="20" r="18" fill="url(#shieldGrad)"/>
            <path d="M12 20 L17 25 L28 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- 3 Feature Pillars -->
        <!-- Pillar 1 -->
        <g transform="translate(25, 90)">
            <rect width="100" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="50" cy="40" r="22" fill="#EBF3FC"/>
            <!-- Beaker icon -->
            <path d="M44 32 L44 36 L38 46 L62 46 L56 36 L56 32 Z" fill="#1565C0"/>
            <text x="50" y="85" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">QC Ketat</text>
            <text x="50" y="105" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Standar Murni</text>
            <text x="50" y="120" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Kemurnian 98%+</text>
        </g>

        <!-- Pillar 2 -->
        <g transform="translate(140, 90)">
            <rect width="100" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="50" cy="40" r="22" fill="#FEF3C7"/>
            <!-- Shield icon -->
            <path d="M50 28 L62 33 V43 C62 50 50 54 50 54 C50 54 38 50 38 43 V33 Z" fill="#F59E0B"/>
            <text x="50" y="85" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Terpercaya</text>
            <text x="50" y="105" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Ribuan Mitra</text>
            <text x="50" y="120" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Industri &amp; UMKM</text>
        </g>

        <!-- Pillar 3 -->
        <g transform="translate(255, 90)">
            <rect width="100" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
            <circle cx="50" cy="40" r="22" fill="#DCFCE7"/>
            <!-- Headset / Chat icon -->
            <path d="M40 40 C40 33 44 29 50 29 C56 29 60 33 60 40 V46 C60 49 57 51 54 51 H46 C43 51 40 49 40 46 Z" fill="#10B981"/>
            <text x="50" y="85" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Konsultasi</text>
            <text x="50" y="105" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Gratis via WA</text>
            <text x="50" y="120" font-family="'Inter', sans-serif" font-size="9" fill="#64748B" text-anchor="middle">Formula Tepat</text>
        </g>
    </g>
</svg>
